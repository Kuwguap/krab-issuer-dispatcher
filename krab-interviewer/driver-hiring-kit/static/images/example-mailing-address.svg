<svg xmlns="http://www.w3.org/2000/svg" width="280" height="200" viewBox="0 0 280 200" role="img" aria-label="Example mailing address format">
  <rect width="280" height="200" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="12" y="12" width="256" height="176" rx="6" fill="#0f172a"/>
  <text x="20" y="34" fill="#f0b429" font-family="system-ui,sans-serif" font-size="9" font-weight="700">EXAMPLE — how to fill mailing address</text>
  <text x="20" y="52" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8">Where we mail your test batch of 10 DMV MVC paper</text>
  <rect x="20" y="62" width="240" height="108" rx="6" fill="#1a2332" stroke="#334155"/>
  <text x="32" y="84" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Eddie Goldman</text>
  <text x="32" y="102" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="10">321 Main Street</text>
  <text x="32" y="120" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="10">Fort Lee New Jersey 07024</text>
  <text x="32" y="148" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">Line 1: Your full name</text>
  <text x="32" y="160" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">Line 2: Street address · Line 3: City State ZIP</text>
</svg>
