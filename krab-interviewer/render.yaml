# Render Blueprint — Krab Interviewer (Telegram bot + web interview API)
#
# REQUIRED: type must be "web" (not worker) so /api/health and /api/interview/* work.
#
# Deploy from this repo:
#   1. Push to https://github.com/Kuwguap/krab-interviewer (or use unity monorepo — see DEPLOY-RENDER.md)
#   2. Render → Blueprint → select repo → Apply
#   3. Set env vars (sync: false) → Manual Deploy
#   4. Confirm https://<service>.onrender.com/api/health → {"ok":true}
#
# Monorepo: use unity root render.yaml with rootDir: krab-interviewer instead.

previews:
  generation: off

services:
  - type: web
    name: krab-interviewer-bot
    runtime: python
    plan: starter
    numInstances: 1
    maxShutdownDelaySeconds: 60
    healthCheckPath: /api/health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DRIVER_CHANNEL_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPERVISORY_TELEGRAM_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: KRAB_SENDER_DATABASE_URL
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      - key: INTERVIEWER_TIMEZONE
        value: America/New_York
      - key: KRAB_DISPATCH_BOT_USERNAME
        value: Krabdispatchbot
      - key: KRAB_INTERVIEWER_BOT_USERNAME
        value: krabinterviewerbot
      - key: ADMIN_PASSWORD
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: KRAB_API_CORS_ALLOWED_ORIGINS
        value: https://tristatetags.com,https://www.tristatetags.com
      - key: KRAB_PUBLIC_BASE_URL
        value: https://krab-interviewer-bot.onrender.com
