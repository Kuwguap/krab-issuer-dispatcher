# ============================================================================
# Render Blueprint — deploys the entire monorepo (Krab Dispatch + Krab Issuer)
# in one go. Add each service's env vars in the Render dashboard after import.
#
# Services provisioned:
#   1. krab-dispatch-api     (Web)    FastAPI backend + /admin static dashboard
#   2. krab-dispatch-bot     (Worker) Krab Dispatch Telegram bot
#   3. krab-issuer-admin     (Web)    Flask admin dashboard (legacy UI, optional)
#   4. krab-issuer-bot       (Worker) Krab Issuer Telegram bot
#   5. paper-investigator    (Worker) Paper Investigator Telegram bot
#   6. krab-interviewer-bot  (Web)    Krab Interviewer bot + /api/interview web form
#   7. krab-insurance-bot    (Worker) Standalone insurance-card Telegram bot
#   8. krab-tg-forwarder     (Web)    Telegram DM forwarder for FB leads
#   9. krab-fb-sales-bot     (Web)    Facebook Messenger sales bot
#
# Import:
#   1. Push this repo to GitHub.
#   2. Render → New + → Blueprint → pick this repo.
#   3. Render reads `render.yaml` and creates all services.
#   4. Open each service → Environment and fill the `sync: false` vars.
# ============================================================================

previews:
  generation: "off"

services:
  # --------------------------------------------------------------------------
  # 1) Krab Dispatch API (FastAPI) + admin dashboard at /admin
  # --------------------------------------------------------------------------
  - type: web
    name: krab-dispatch-api
    runtime: python
    rootDir: krab-sender
    plan: starter
    healthCheckPath: /health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      # Shared Supabase (Krab Issuer project) — enables cross-bot reference
      # resolution and receipt thumbnails on the unified Transactions tab.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional OpenAI tie-breaker for fuzzy reference matching + summary Q&A.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODELS
        sync: false
      # CORS: comma-separated origins allowed to hit the API. Regex is
      # pre-configured in code to allow Vercel previews + localhost.
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false

  # --------------------------------------------------------------------------
  # 2) Krab Dispatch Telegram bot (background worker)
  # --------------------------------------------------------------------------
  - type: worker
    name: krab-dispatch-bot
    runtime: python
    rootDir: krab-sender
    plan: starter
    numInstances: 1
    maxShutdownDelaySeconds: 60
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: EMAIL_PROVIDER
        value: sendgrid
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_TO_ADDRESS
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      # Bot calls the API service above (use the Render-generated URL).
      - key: API_BASE_URL
        sync: false
      - key: ISSUER_GROUP_CHAT_ID
        sync: false
      - key: HIGHKAGE_TEAM_CHAT_ID
        sync: false
      - key: SENSEI_GROUP_HANDLES
        sync: false
      - key: HIGHKAGE_GROUP_HANDLES
        sync: false
      # Same Supabase project as Krab Issuer so reference IDs resolve.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # 3) Krab Issuer admin dashboard (Flask)
  #    Optional — the unified dashboard at krab-dispatch-api:/admin covers this
  #    via the Issuer tab. Keep if you want the legacy Flask UI too.
  #    Uses the same Docker image as the bot so the tesseract binary is
  #    available for any image-processing endpoints.
  # --------------------------------------------------------------------------
  - type: web
    name: krab-issuer-admin
    runtime: docker
    rootDir: krableadsV2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python admin_dashboard.py
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LEAD_INGEST_API_KEY
        sync: false
      - key: API_LEAD_USER_ID
        value: tristatetag
      - key: LEAD_INGEST_SOURCE_LABEL
        value: External API
      - key: ONETIMESECRET_USERNAME
        sync: false
      - key: ONETIMESECRET_API_KEY
        sync: false
      - key: ONETIMESECRET_URL
        sync: false
      - key: ONETIMESECRET_LINK_BASE
        sync: false
      - key: ONETIMESECRET_PASSPHRASE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Allow the new unified admin page to embed the Flask admin in an iframe.
      - key: ADMIN_FRAME_ANCESTORS
        sync: false
      # Checkout-document AI gap-fill (VIN/insurance/DL) on the ingest + attach
      # endpoints. Without it, images still deliver — only auto-fill is skipped.
      - key: OPENAI_API_KEY
        sync: false
      # Immediate ledger registration for website leads (same as the bot).
      - key: KRAB_DISPATCH_API_URL
        value: https://krab-dispatch-api.onrender.com
      - key: KRAB_DISPATCH_ADMIN_PASSWORD
        sync: false

  # --------------------------------------------------------------------------
  # 4) Krab Issuer Telegram bot (background worker)
  #    Docker runtime so we can ship tesseract-ocr (used for pixel-precise
  #    phone-number redaction in user-uploaded images).
  # --------------------------------------------------------------------------
  - type: worker
    name: krab-issuer-bot
    runtime: docker
    rootDir: krableadsV2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python bot.py
    plan: starter
    numInstances: 1
    maxShutdownDelaySeconds: 60
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MONDAY_API_KEY
        sync: false
      - key: MONDAY_BOARD_ID
        sync: false
      - key: ONETIMESECRET_USERNAME
        sync: false
      - key: ONETIMESECRET_API_KEY
        sync: false
      - key: ONETIMESECRET_URL
        sync: false
      - key: ONETIMESECRET_LINK_BASE
        sync: false
      - key: ONETIMESECRET_PASSPHRASE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: API_LEAD_USER_ID
        value: tristatetag
      - key: DRIVER_TELEGRAM_ID
        sync: false
      - key: GROUP_TELEGRAM_ID
        sync: false
      - key: SUPERVISORY_TELEGRAM_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        sync: false
      - key: RECEIPT_DETECTION_MODE
        sync: false
      - key: API_NINJAS_API_KEY
        sync: false
      - key: VIN_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: INTEGRATIONS_API_KEY
        sync: false
      - key: TRISTATECOVERAGE_API_BASE
        value: https://tristatecoverage.com
      # Immediate ledger registration on tristatetags.com/backend (krab-dispatch-api).
      # KRAB_DISPATCH_ADMIN_PASSWORD must equal krab-dispatch-api's ADMIN_PASSWORD.
      - key: KRAB_DISPATCH_API_URL
        value: https://krab-dispatch-api.onrender.com
      - key: KRAB_DISPATCH_ADMIN_PASSWORD
        sync: false
      # Client follow-up + daily receipt digest email (Resend already above; SendGrid
      # is the fallback sender). FOLLOWUP_* also seed the receipt-owed email copy.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM
        sync: false
      - key: FOLLOWUP_AGENCY_NAME
        value: Tri State Coverage
      - key: FOLLOWUP_WEBSITE
        value: Www.tristatetags.com
      - key: FOLLOWUP_PHONE
        value: 551-301-3737
      - key: FOLLOWUP_EMAIL_COPY
        value: SendReceiptToday@gmail.com
      # Optional follow-up SMS (Twilio). Leave blank to email-only.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Driver GPS tracking site (Vercel). Location sharing is optional.
      - key: TRACKING_SITE_BASE_URL
        sync: false
      - key: TRACKING_TIMEOUT_MINUTES
        value: "5"
      - key: TRACKING_ARRIVAL_RADIUS_M
        value: "200"
      # Renewals (optional — sensible defaults if unset).
      - key: RENEWAL_DAYS
        value: "28"
      - key: RENEWAL_ESCALATION_MINUTES
        value: "5"
      # NOTE: the NJ temp-tag PDF generator needs NO new env — it uses the
      # existing Supabase (allocate_temp_plate RPC + migration_tag_plates.sql)
      # and bundled templates/fonts; VIN decode is the keyless NHTSA vPIC API.

  # --------------------------------------------------------------------------
  # 5) Paper Investigator Telegram bot (background worker)
  # --------------------------------------------------------------------------
  - type: worker
    name: paper-investigator-bot
    runtime: python
    rootDir: krableadsV2/paper_investigator
    plan: starter
    numInstances: 1
    maxShutdownDelaySeconds: 30
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt "pytz>=2024.1"
    startCommand: python bot.py
    envVars:
      - key: PAPER_BOT_TOKEN
        sync: false
      - key: PAPER_SUPERVISOR_TELEGRAM_ID
        sync: false
      - key: PAPER_GIRL_TELEGRAM_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false

  # --------------------------------------------------------------------------
  # 6) Krab Interviewer — Web service (bot + FastAPI /api/interview for tristatetags)
  #    MUST stay type: web. healthCheck: /api/health. See krab-interviewer/DEPLOY-RENDER.md
  # --------------------------------------------------------------------------
  - type: web
    name: krab-interviewer-bot
    runtime: python
    rootDir: krab-interviewer
    plan: starter
    numInstances: 1
    maxShutdownDelaySeconds: 60
    healthCheckPath: /api/health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      # New bot only — set manually if blueprint sync does not apply on updates.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DRIVER_CHANNEL_ID
        sync: false
      - key: SUPABASE_URL
        fromService:
          name: krab-issuer-bot
          type: worker
          envVarKey: SUPABASE_URL
      - key: SUPABASE_KEY
        fromService:
          name: krab-issuer-bot
          type: worker
          envVarKey: SUPABASE_KEY
      - key: SUPERVISORY_TELEGRAM_ID
        fromService:
          name: krab-issuer-bot
          type: worker
          envVarKey: SUPERVISORY_TELEGRAM_ID
      - key: OPENAI_API_KEY
        fromService:
          name: krab-issuer-bot
          type: worker
          envVarKey: OPENAI_API_KEY
      - key: KRAB_SENDER_DATABASE_URL
        fromService:
          name: krab-dispatch-api
          type: web
          envVarKey: DATABASE_URL
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      - key: INTERVIEWER_TIMEZONE
        value: America/New_York
      - key: KRAB_DISPATCH_BOT_USERNAME
        value: Krabdispatchbot
      - key: KRAB_INTERVIEWER_BOT_USERNAME
        value: krabinterviewerbot
      - key: ADMIN_PASSWORD
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: KRAB_API_CORS_ALLOWED_ORIGINS
        value: https://tristatetags.com,https://www.tristatetags.com
      - key: KRAB_PUBLIC_BASE_URL
        value: https://krab-interviewer-bot.onrender.com
      - key: PAPER_GIRL_TELEGRAM_ID
        sync: false
      - key: PAPER_GIRL_NOTIFY_CHAT_IDS
        value: -1003903904177
      - key: PAPER_GIRL_USERNAME
        sync: false

  # --------------------------------------------------------------------------
  # 7) Standalone Krab Insurance Telegram bot (background worker)
  #    Independent insurance-card flow (image/text/PDF -> FS-20 + portal + email)
  # --------------------------------------------------------------------------
  - type: worker
    name: krab-insurance-bot
    runtime: docker
    rootDir: krabinsurancebot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python bot.py
    plan: starter
    numInstances: 1
    maxShutdownDelaySeconds: 60
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: INTEGRATIONS_API_KEY
        sync: false
      - key: TRISTATECOVERAGE_API_BASE
        value: https://tristatecoverage.com
      - key: INSURANCE_ISSUER_NAME
        value: Serviced by AIPSO-SAIP
      - key: INSURANCE_ISSUER_PHONE
        sync: false
      - key: INSURANCE_ISSUER_ADDRESS
        value: PO Box 6400|Providence, RI 02940-6200
      - key: INSURANCE_CARRIER_NAME
        value: 707 National Specialty Insurance Company
      - key: VIN_PROVIDER
        value: nhtsa
      - key: API_NINJAS_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # 8) Telegram forwarder (FB lead -> DM to team)
  # --------------------------------------------------------------------------
  - type: web
    name: krab-tg-forwarder
    runtime: docker
    rootDir: krab-tg-forwarder
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: FORWARDER_API_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_TARGET_CHAT_ID
        sync: false
      - key: PORT
        value: "8090"

  # --------------------------------------------------------------------------
  # 9) Facebook Messenger sales bot (OpenAI intake -> forwarder)
  # --------------------------------------------------------------------------
  - type: web
    name: krab-fb-sales-bot
    runtime: docker
    rootDir: krabfbbot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FORWARDER_API_KEY
        fromService:
          name: krab-tg-forwarder
          type: web
          envVarKey: FORWARDER_API_KEY
      - key: FORWARDER_BASE_URL
        fromService:
          name: krab-tg-forwarder
          type: web
          property: host
      - key: PORT
        value: "8080"
